name: Semantic Pull Requests
"on":
  pull_request_target:
    types: [ opened, edited, synchronize, reopened ]
permissions:
  pull-requests: read
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
