name: Languages
"on":
  push:
  pull_request:

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"
      - uses: julia-actions/setup-julia@v2
      - uses: r-lib/actions/setup-r@v2
      - name: Install toolchains (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl lua5.4 sqlite3 groovy clisp guile-3.0 racket gforth gfortran ocaml-nox ghc elixir erlang zsh gnat fpc valac swi-prolog || true
      - name: Ada
        run: gnatmake languages/ada/luceraci.adb -o /tmp/hello_ada && /tmp/hello_ada
        continue-on-error: true
      - name: Awk
        run: awk -f languages/awk/bikumuna.awk /dev/null
        continue-on-error: true
      - name: Brainfuck
        run: python3 tools/bf.py languages/brainfuck/hello.bf
        continue-on-error: true
      - name: C
        run: gcc languages/c/woxyroqa.c -o /tmp/hello_c && /tmp/hello_c
        continue-on-error: true
      - name: C#
        run: cd languages/csharp && dotnet run
        continue-on-error: true
      - name: C++
        run: g++ languages/cpp/quvohe.cpp -o /tmp/hello_cpp && /tmp/hello_cpp
        continue-on-error: true
      - name: Common Lisp
        run: clisp languages/lisp/kabapo.lisp
        continue-on-error: true
      - name: Elixir
        run: elixir languages/elixir/dipu.ex
        continue-on-error: true
      - name: Erlang
        run: escript languages/erlang/moqi.erl
        continue-on-error: true
      - name: F#
        run: cd languages/fsharp && dotnet fsi nori.fs
        continue-on-error: true
      - name: Forth
        run: gforth languages/forth/zinono.fth -e bye
        continue-on-error: true
      - name: Fortran
        run: gfortran languages/fortran/nikimu.f90 -o /tmp/hello_f90 && /tmp/hello_f90
        continue-on-error: true
      - name: Go
        run: cd languages/go && go run jiju.go
        continue-on-error: true
      - name: Groovy
        run: groovy languages/groovy/rupofo.groovy
        continue-on-error: true
      - name: Haskell
        run: runghc languages/haskell/siduqytu.hs
        continue-on-error: true
      - name: Java
        run: java languages/java/xyjere.java
        continue-on-error: true
      - name: JavaScript
        run: node languages/javascript/kedu.js
        continue-on-error: true
      - name: Julia
        run: julia languages/julia/xiwomeda.jl
        continue-on-error: true
      - name: Lua
        run: lua5.4 languages/lua/dixunote.lua
        continue-on-error: true
      - name: OCaml
        run: ocaml languages/ocaml/dixo.ml
        continue-on-error: true
      - name: Pascal
        run: fpc languages/pascal/foca.pas -o/tmp/hello_pas >/dev/null && /tmp/hello_pas
        continue-on-error: true
      - name: Perl
        run: perl languages/perl/fehelo.pl
        continue-on-error: true
      - name: PHP
        run: php languages/php/kifebahi.php
        continue-on-error: true
      - name: Prolog
        run: swipl -q -g "main" -t halt -f languages/prolog/bimose.pro
        continue-on-error: true
      - name: Python
        run: python3 languages/python/wydecucu.py
        continue-on-error: true
      - name: R
        run: Rscript languages/r/tumy.R
        continue-on-error: true
      - name: Racket
        run: racket languages/racket/tubige.rkt
        continue-on-error: true
      - name: Ruby
        run: ruby languages/ruby/wizi.rb
        continue-on-error: true
      - name: Rust
        run: rustc languages/rust/zobicy.rs -o /tmp/hello_rs && /tmp/hello_rs
        continue-on-error: true
      - name: Scheme
        run: guile languages/scheme/xyle.scm
        continue-on-error: true
      - name: sed
        run: echo foo | sed -f languages/sed/gisy.sed
        continue-on-error: true
      - name: Shell
        run: bash languages/shell/zuninycy.sh
        continue-on-error: true
      - name: SQL
        run: sqlite3 :memory: < languages/sql/baxe.sql
        continue-on-error: true
      - name: Tcl
        run: tclsh languages/tcl/redajyje.tcl
        continue-on-error: true
      - name: TypeScript
        run: cd languages/typescript && npx --yes tsc wasako.ts && node wasako.js
        continue-on-error: true
      - name: Vala
        run: valac languages/vala/nygu.vala -o /tmp/hello_vala && /tmp/hello_vala
        continue-on-error: true
      - name: Visual Basic .NET
        run: cd languages/vb && dotnet run
        continue-on-error: true
